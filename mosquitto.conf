# Place your local configuration in /etc/mosquitto/conf.d/
#
# A full description of the configuration file is at
# /usr/share/doc/mosquitto/examples/mosquitto.conf.example

#pid_file /run/mosquitto/mosquitto.pid

# Retained messages and subscriptions survive a broker restart.
# /mosquitto/data is the image's own data directory: it is a volume with correct
# ownership, unlike /var/lib/mosquitto which does not exist in the image at all
# (that is why every autosave printed "No such file or directory").
persistence true
persistence_location /mosquitto/data/

# In a container the log destination is stdout: the runtime collects it, and the
# broker no longer needs write access to a bind-mounted host directory
# (that mount was a file path turned into a root-owned directory, so the broker
# running as uid 1883 could not create mosquitto.log there).
log_dest stdout
log_dest topic
log_type all

allow_anonymous false
listener 1883 0.0.0.0
password_file /etc/mosquitto/passwd
